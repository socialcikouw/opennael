<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenNael — Bos</title>
    <script>
      // Pasang mode gelap SEBELUM halaman tergambar (tanpa kilatan putih). Kunci & aturan sama
      // dengan src/lib/tema.ts: "gelap" / "terang" tersimpan, selain itu ikuti perangkat.
      try {
        const t = localStorage.getItem("nael.tema");
        if (t === "gelap" || (t !== "terang" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
